name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: 测试
        run: dotnet test SourceGenerators.Shared.slnx -c Release
      - name: 打包
        run: dotnet pack src/SourceGenerators.Shared/SourceGenerators.Shared.csproj -c Release -o artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/packages/*.nupkg
